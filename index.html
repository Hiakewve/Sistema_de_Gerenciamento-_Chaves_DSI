<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
    
    <title>Login - Gestão de Chaves DSI</title>
</head>
<body class="pagina-inicial">
    <header>
        <h1>DSI - Gestão de Chaves</h1>
        <p>Departamento de Sistemas de Informação</p>
    </header>

    <main>
        <section>
            <h2>Acesso ao Sistema</h2>
            <p style="text-align: center; margin-bottom: 1.5em;">
                Faça login com a sua conta do Google para acessar o painel.
            </p>
            <div style="display: flex; justify-content: center;">
                <button id="btn-login-google" type="button">
                    Entrar com Google
                </button>
            </div>
            <p id="mensagem-login" class="mensagem-feedback" role="status" aria-live="polite" style="text-align: center; color: #dc3545;"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Chaves Laboratórios - Todos os Direitos Reservados.</p>
    </footer>
